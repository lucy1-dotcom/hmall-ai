server:
  port: 8085
spring:
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 192.168.150.131:8848
    # Sentinel 控制台（可选）：规则由 SentinelRuleConfig 用代码加载，不依赖 dashboard
