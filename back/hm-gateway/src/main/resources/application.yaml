server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    nacos:
      server-addr: 192.168.150.131:8848
    gateway:
      routes:
        - id: item # 路由规则id，自定义，唯一
          uri: lb://item-service # 路由的目标服务，lb代表负载均衡，会从注册中心拉取服务列表
          predicates: # 路由断言，判断当前请求是否符合当前规则，符合则路由到目标服务
            - Path=/items/**,/search/** # 这里是以请求路径作为判断规则
        - id: cart
          uri: lb://cart-service
          predicates:
            - Path=/carts/**
        - id: pay
          uri: lb://pay-service
          predicates:
            - Path=/pay-orders/**
        - id: trade
          uri: lb://trade-service
          predicates:
            - Path=/orders/**
        - id: user
          uri: lb://user-service
          predicates:
            - Path=/addresses/**,/users/**
        - id: trade-api # 给 Python AI 服务（hmall-ai）查订单用的路由
          uri: lb://trade-service
          predicates:
            - Path=/api/order/**
hm:
  ai: # Python AI 服务（hmall-ai），前端不直连它，统一由网关转发
    service-url: http://hmall-ai # 走 Nacos 服务发现，别写成 IP:PORT
    connect-timeout-ms: 3000
    response-timeout-seconds: 180
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi
      - /api/order/** # 供 AI 服务内部调用，userId 由调用方显式传入
      - /chat/** # AI 对话：经验证后转发给 Python，不走 JWT
      - /api/chat/** # 直连网关时的同上路径（Nginx 会剥掉 /api 前缀）