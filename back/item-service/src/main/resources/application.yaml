server:
  port: 8081
spring:
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 192.168.150.131:8848
    # Sentinel 控制台（可选）：没启动 dashboard 时代码里的规则依然生效，
    # 只是每 10 秒会打一条连接失败的 WARN，嫌吵可以先注释掉 transport。
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8720
      eager: true
logging:
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 商品服务接口文档
    description: "黑马商城接口文档"
    email: zhanghuyi@itcast.cn
    concat: 虎哥
    url: https://www.itcast.cn
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.hmall.item.controller
