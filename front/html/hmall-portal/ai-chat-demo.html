<!DOCTYPE html>
<!--
  hmall-ai 流式对话演示页（原生 JS，不依赖 Vue）
  访问：http://localhost:18080/ai-chat-demo.html
  前置：hmall-ai 跑在 8087，且 .env 里配了 DEEPSEEK_API_KEY
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hmall AI 客服（流式演示）</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f5f5; }
    .wrap { max-width: 720px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.08); overflow: hidden; }
    header { padding: 16px 20px; border-bottom: 1px solid #eee; font-weight: 600; }
    #chat { height: 420px; overflow-y: auto; padding: 16px 20px; }
    .row { display: flex; margin-bottom: 12px; }
    .row.me { justify-content: flex-end; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .me .bubble { background: #e4393c; color: #fff; }
    .ai .bubble { background: #f0f2f5; color: #333; }
    .ai .bubble.typing::after { content: '▌'; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #status { min-height: 18px; font-size: 12px; color: #999; padding: 0 20px 8px; }
    form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid #eee; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    button { padding: 10px 18px; border: 0; border-radius: 6px; background: #e4393c; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hint { padding: 10px 20px; font-size: 12px; color: #999; border-top: 1px dashed #eee; }
  </style>
</head>
<body>
<div class="wrap">
  <header>hmall 智能客服 · SSE 流式演示</header>
  <div id="chat"></div>
  <div id="status"></div>
  <form id="form">
    <input id="msg" autocomplete="off" placeholder="试试问：拆封的手机能退吗？" />
    <button id="send" type="submit">发送</button>
  </form>
  <div class="hint">会话 id 存在 localStorage，刷新页面还能接着聊（记忆保留在 AI 服务内存里，重启即清空）。</div>
</div>

<script>
  // 前端只跟 Java 网关打交道：Nginx 把 /api 剥掉后转给 8080，由 AiChatController 再转发给 Python
  // （不给 Python 开跨域，也不用在前端暴露 8000 端口）
  const AI_BASE = '';

  const chatEl = document.getElementById('chat');
  const statusEl = document.getElementById('status');
  const form = document.getElementById('form');
  const input = document.getElementById('msg');
  const sendBtn = document.getElementById('send');

  // 会话 id 由服务端 meta 事件返回，这里缓存下来，下一轮继续用
  let sessionId = localStorage.getItem('hmall_ai_session') || null;

  function addBubble(text, role) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text || '';
    row.appendChild(bubble);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  /**
   * 发送消息并消费 SSE 流。
   * 注意：原生 EventSource 只支持 GET，这里必须用 fetch + ReadableStream 手动解析。
   */
  async function chat(message) {
    addBubble(message, 'me');
    const bubble = addBubble('', 'ai');
    bubble.classList.add('typing');
    statusEl.textContent = '连接中…';

    let answer = '';
    const res = await fetch(AI_BASE + '/api/chat/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: 1, message, session_id: sessionId })
    });

    // 参数错误 / 没配密钥等情况会在这里就返回普通 JSON，而不是流
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      bubble.classList.remove('typing');
      bubble.textContent = '出错了：' + (err.message || res.status);
      statusEl.textContent = '';
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      // stream: true 保证多字节汉字被完整解码
      buffer += decoder.decode(value, { stream: true });

      // SSE 以空行分隔事件，这里按 \n\n 切包，剩下的留到下次
      let sep;
      while ((sep = buffer.indexOf('\n\n')) >= 0) {
        const rawEvent = buffer.slice(0, sep);
        buffer = buffer.slice(sep + 2);

        for (const line of rawEvent.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const payload = JSON.parse(line.slice(5).trim());

          switch (payload.type) {
            case 'meta':
              sessionId = payload.session_id;
              localStorage.setItem('hmall_ai_session', sessionId);
              statusEl.textContent = '';
              break;
            case 'tool':
              statusEl.textContent = '正在调用工具：' + payload.name;
              break;
            case 'token':
              answer += payload.content;
              bubble.textContent = answer;            // 打字机效果
              chatEl.scrollTop = chatEl.scrollHeight;
              break;
            case 'error':
              bubble.classList.remove('typing');
              bubble.textContent = answer ? answer + '\n\n[出错] ' + payload.message : payload.message;
              statusEl.textContent = '';
              return;
            case 'done':
              bubble.classList.remove('typing');
              statusEl.textContent = '完成';
              return;
            default:
              break;
          }
        }
      }
    }
    bubble.classList.remove('typing');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    sendBtn.disabled = true;
    try {
      await chat(message);
    } catch (err) {
      statusEl.textContent = '请求失败：' + err.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
